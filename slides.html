<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rachel Ramsey | IDC 6940</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 400;
      color: #555;
      margin-bottom: 2rem;
    }

    .button-group button {
      padding: 12px 20px;
      font-size: 1rem;
      background-color: #0366d6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 8px;
    }

    .button-group button:hover {
      background-color: #024ea2;
    }

    .pdf-container {
      margin-top: 30px;
      display: none;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Rachel Ramsey IDC 6940</h1>
    <h2>Using Machine Learning Techniques to Project Occupational Employment Data</h2>

    <div class="button-group">
      <button onclick="togglePDF('week1')">View Week 1 Homework</button>
      <button onclick="togglePDF('week2')">View Week 2 Literature Review</button>
    </div>

    <div class="pdf-container" id="week1">
      <iframe src="Week1-HW.pdf"></iframe>
    </div>

    <div class="pdf-container" id="week2">
      <iframe src="Week2-Literature_Review.pdf"></iframe>
    </div>
  </div>

  <script>
    function togglePDF(id) {
      const viewer = document.getElementById(id);
      viewer.style.display =
        viewer.style.display === "none" || viewer.style.display === ""
          ? "block"
          : "none";
    }
  </script>
</body>
</html>
