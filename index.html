<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rachel Ramsey | IDC 6940</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0;
      padding: 0;
    }

    /* Header (same text as before, just styled as a header section) */
    header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 28px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin: 0 0 0.5rem 0;
    }

    header h2 {
      font-size: 1.25rem;
      font-weight: 400;
      color: #555;
      margin: 0;
    }

    /* Main layout */
    .layout {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Left menu */
    .sidebar {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px;
      position: sticky;
      top: 16px;
    }

    .sidebar h3 {
      margin: 6px 0 12px;
      font-size: 1rem;
      color: #444;
      text-align: left;
    }

    .menu-btn {
      width: 100%;
      text-align: left;
      padding: 12px 12px;
      font-size: 1rem;
      background-color: #0366d6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .menu-btn:hover {
      background-color: #024ea2;
    }

    .menu-btn.active {
      background-color: #023b7a;
    }

    /* Viewer area */
    .viewer {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px;
    }

    .viewer-title {
      text-align: left;
      margin: 6px 0 12px;
      font-size: 1rem;
      color: #444;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    /* Mobile responsiveness */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      iframe {
        height: 70vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Rachel Ramsey IDC 6940</h1>
    <h2>Using Machine Learning Techniques to Project Occupational Employment Data</h2>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h3>Assignments</h3>
      <button class="menu-btn active" onclick="loadPDF('Week1-HW.pdf', this)">
        Week 1 Homework
      </button>
      <button class="menu-btn" onclick="loadPDF('Week2-Literature_Review.pdf', this)">
        Week 2 Literature Review
      </button>
    </aside>

    <section class="viewer">
      <div class="viewer-title" id="viewerTitle">Week 1 Homework</div>
      <iframe id="pdfFrame" src="Week1-HW.pdf" title="PDF Viewer"></iframe>
    </section>
  </main>

  <script>
    function loadPDF(fileName, buttonEl) {
      // Update iframe
      const frame = document.getElementById("pdfFrame");
      frame.src = fileName;

      // Update title based on button text
      document.getElementById("viewerTitle").textContent = buttonEl.textContent.trim();

      // Update active button styling
      document.querySelectorAll(".menu-btn").forEach(btn => btn.classList.remove("active"));
      buttonEl.classList.add("active");
    }
  </script>
</body>
</html>
